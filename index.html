
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <nav class="navbar">
        <h2>Student Performance System</h2>
        <a href="/dashboard">Dashboard</a>
    </nav>

    <div class="form-card">
        <h1>Student Registration</h1>
        <p class="subtitle">Enter student academic details below</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="/add_student" method="POST">

            <div class="form-grid">

                <div>
                    <label>Student ID</label>
                    <input type="text" name="student_id" required>
                </div>

                <div>
                    <label>Student Name</label>
                    <input type="text" name="student_name" required>
                </div>

                <div>
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div>
                    <label>Age</label>
                    <input type="number" name="age" min="1" required>
                </div>

                <div>
                    <label>Class</label>
                    <input type="text" name="class" required>
                </div>

                <div>
                    <label>Attendance (%)</label>
                    <input type="number" name="attendance"
                           min="0" max="100" step="0.01" required>
                </div>

                <div>
                    <label>Study Hours</label>
                    <input type="number" name="study_hours"
                           min="0" step="0.1" required>
                </div>

                <div>
                    <label>Assignment Score</label>
                    <input type="number" name="assignment_score"
                           min="0" max="100" step="0.01" required>
                </div>

                <div>
                    <label>Exam Score</label>
                    <input type="number" name="exam_score"
                           min="0" max="100" step="0.01" required>
                </div>

            </div>

            <button type="submit">Add Student</button>

        </form>
    </div>

</div>

</body>
</html>
